<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name - Portfolio</title>
  <style>
    :root {
      --bg: #121212;
      --text: #e0e0e0;
      --accent: #ffffff;
      --card-bg: #1e1e1e;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 3rem;
    }
    h1 {
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .card-body {
      padding: 1rem;
    }
    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid #333;
      font-size: 0.9rem;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Your Name</h1>
      <p>Brief title or bio summarizing your work and focus.</p>
    </header>

    <main>
      <h2>Featured Work</h2>
      <div class="grid">
        <div class="card">
          <img src="https://via.placeholder.com/600x400" alt="Project 1">
          <div class="card-body">
            <h3>Project Title</h3>
            <p>Short description of the project, tools used, or role.</p>
          </div>
        </div>
        <!-- Add more cards as needed -->
      </div>
    </main>

    <footer>
      <p>Contact: <a href="mailto:your@email.com">your@email.com</a> | <a href="#">Social/Platform Link</a></p>
    </footer>
  </div>
</body>
</html>
